spring.application.name=backend

# Load local-only secrets (DB url/username/password) from a git-ignored file.
# "optional:" means the app still starts if the file is missing (e.g. in
# production, where these values come from environment variables instead).
spring.config.import=optional:application-local.properties

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false